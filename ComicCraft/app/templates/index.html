<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ComicCraft | AI Comic Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{ min-height:100vh; background: #0e0a1f; color:#fff; display:flex; flex-direction:column; align-items:center; padding:25px 20px; position:relative; overflow-x:hidden; }
body::before{ content:''; position:fixed; inset:0; background-image: url('https://images.unsplash.com/photo-1612036782180-6f0b6cd846fe?q=80&w=2070'); background-size: cover; background-position: center; opacity: 0.12; filter: blur(2px); z-index:-2; }
body::after{ content:''; position:fixed; inset:0; background: radial-gradient(circle at 20% 30%, rgba(124,58,237,0.35) 0%, transparent 50%), radial-gradient(circle at 80% 80%, rgba(168,85,247,0.30) 0%, transparent 50%), linear-gradient(180deg, rgba(14,10,31,0.85) 0%, rgba(14,10,31,0.95) 100%); z-index:-1; }
nav{width:100%;max-width:1000px;display:flex;justify-content:space-between;align-items:center;margin-bottom:35px}
.logo{font-weight:700;font-size:1.5rem} .logo span{color:#a855f7}
.badge{background:rgba(168,85,247,0.15);border:1px solid rgba(168,85,247,0.3);color:#c4b5fd;padding:6px 14px;border-radius:20px;font-size:0.8rem;backdrop-filter:blur(10px)}
.hero{text-align:center;margin-bottom:30px}
.hero h1{font-size:2.6rem; font-weight:700; line-height:1.15;} .hero h1 .grad{background:linear-gradient(90deg,#a855f7,#7c3aed,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:#a1a1aa;margin-top:12px;font-size:1rem}
.main-card{width:100%;max-width:720px;background:rgba(24,18,49,0.7);backdrop-filter:blur(18px);border:1px solid rgba(168,85,247,0.2);border-radius:20px;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,0.6)}
.search-box{display:flex;gap:10px;background:rgba(0,0,0,0.4);border:1px solid rgba(168,85,247,0.25);padding:7px;border-radius:14px;}
.search-box input{flex:1;background:transparent;border:none;color:#fff;font-size:0.95rem;padding:10px 12px;outline:none}
.search-box button{background:linear-gradient(90deg,#7c3aed,#a855f7);border:none;color:#fff;padding:11px 22px;border-radius:10px;font-weight:600;cursor:pointer;}
.chips{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap} .chips span{font-size:0.75rem;color:#c4b5fd;background:rgba(168,85,247,0.1);border:1px solid rgba(168,85,247,0.2);padding:6px 12px;border-radius:20px;cursor:pointer}
.result{margin-top:22px;background:rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:20px;min-height:160px}
.label{font-size:0.7rem;letter-spacing:1.2px;color:#a855f7;font-weight:600;margin-bottom:10px}
#story-box{color:#d4d4d8;line-height:1.7;font-size:0.95rem;white-space:pre-wrap}
.comic-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.comic-grid img{width:100%;border-radius:12px;border:1px solid rgba(168,85,247,0.3);background:#000}
.panel-label{font-size:0.7rem;color:#c4b5fd;margin-bottom:4px}
.loading{color:#c4b5fd;animation:pulse 1.2s infinite} @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
.footer{margin-top:35px;color:#52525b;font-size:0.8rem}
.panel-label{ display:none !important; }
.book-page{ min-width:100%; background:#fffdf7; padding:25px; text-align:center; border-radius:20px; }
.book-page img{ width:100%; height:350px; object-fit:cover; border-radius:20px; box-shadow:0 8px 20px rgba(168,85,247,0.3); }
.book-page .story-text{ margin-top:20px; background:white; padding:15px; border-radius:15px; border-left:5px solid #a855f7; text-align:left; font-family:'Comic Sans MS'; }
#book-container{ max-width:600px; margin:20px auto; position:relative; overflow:hidden; border-radius:20px; box-shadow:0 10px 30px rgba(0,0,0,0.2); }
#book-slider{ display:flex; transition:transform 0.6s ease-in-out; }
</style>
</head>
<body>
 <div id="book-container">
    <div id="book-slider">
        <!-- panels inga varum -->
    </div>
    <button onclick="prevPage()" style="position:absolute; left:10px; top:50%; background:#a855f7; color:white; border:none; border-radius:50%; width:40px; height:40px; cursor:pointer; transform:translateY(-50%);">‹</button>
    <button onclick="nextPage()" style="position:absolute; right:10px; top:50%; background:#a855f7; color:white; border:none; border-radius:50%; width:40px; height:40px; cursor:pointer; transform:translateY(-50%);">›</button>
</div>
<p id="page-num" style="text-align:center; margin-top:15px; color:#a855f7; font-weight:bold;">Page 1 / 6</p>   
<nav><div class="logo">ComicCraft<span>.</span></div><div class="badge">✦ Purple Edition • Gemini AI</div></nav>
<div class="hero"><h1>Turn Ideas Into <br><span class="grad">Comic Stories</span></h1><p>Your imagination, powered by AI.</p></div>
<div class="main-card">
<div class="search-box">
<input id="prompt" type="text" placeholder="e.g., A cat detective in Chennai...">
<button onclick="generateStory()">Generate</button>
</div>
<div class="chips">
<span onclick="setEx('A superhero cat in Chennai')">🐱 Super Cat</span>
<span onclick="setEx('Robot becomes a dosa master')">🤖 Robot Dosa</span>
<span onclick="setEx('Time travel to Chola dynasty')">🏛️ Chola Time Travel</span>
</div>
<div class="result">
<div class="label">● STORY OUTPUT</div>
<div id="story-box">Your comic story will appear here...</div>
<div id="image-grid" class="comic-grid"></div>
</div>
</div>
<div class="footer">ComicCraft Project • Purple Theme • 2026</div>
<script>
function setEx(t){document.getElementById('prompt').value=t}
async function generateStory(){
 const p=document.getElementById('prompt').value; 
 const box=document.getElementById('story-box');
 const grid=document.getElementById('image-grid');
 if(!p){box.innerText="Please enter an idea!";return;}
 box.innerHTML='<span class="loading">💜 Generating with Purple Magic...</span>';
 grid.innerHTML='';
 try{
  const res=await fetch('/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:p})});
  const data=await res.json();
  box.innerText=data.story||"No story returned.";
  if(data.images && data.images.length > 0){
    grid.innerHTML='';
    data.images.forEach((url,i)=>{
      const div=document.createElement('div');
      div.innerHTML = `<div class="panel-label">Panel ${i+1}</div><img src="${url}" alt="Panel ${i+1}" onerror="this.src='https://placehold.co/512x512/6d28d9/ffffff?text=Panel+${i+1}'">`;
      grid.appendChild(div);
    });
  }
 }catch(e){box.innerText="Error: Check terminal - " + e;}
}
</script>
</body>
</html>
